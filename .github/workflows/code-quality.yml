name: Code Quality Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Incremental Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            build
            compile_commands.json
          key: ${{ runner.os }}-milo-build-${{ hashFiles('.devcontainer/Dockerfile', 'Makefile', 'kernel/kernel.mk', 'arch/**/*.mk') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-milo-build-${{ hashFiles('.devcontainer/Dockerfile', 'Makefile', 'kernel/kernel.mk', 'arch/**/*.mk') }}-
            ${{ runner.os }}-milo-build-

      - name: Build Kernel and Run Quality Suite in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: make -j"$(nproc)" build/kernel.bin quality

      - name: Upload Quality and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: build/reports/
          retention-days: 14